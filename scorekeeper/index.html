<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="OpenMat matside wrestling scorekeeper for iPhone, iPad, and laptop with Chrome Presentation TV scoreboard.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0c121c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>OpenMat Scorekeeper — Matside Console and TV Scoreboard</title>
    <style>
      :root {
        color-scheme: dark;
        --target-size: 24px;
        --bg-canvas: #0c121c;
        --bg-panel: #122030;
        --bg-elevated: #1b2d42;
        --border-subtle: #2b3f59;
        --border-strong: #476285;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-gold: #facc15;
        --emerald: #10b981;
        --emerald-dark: #14644c;
        --red-deck: #301018;
        --red-primary: #b92337;
        --red-secondary: #871c2d;
        --green-deck: #0c2c20;
        --green-primary: #168252;
        --green-secondary: #126240;
      }

      @media (pointer: coarse) {
        :root {
          --target-size: 44px;
        }
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-block-size: 100dvh;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font: 14px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-variant-numeric: tabular-nums;
        overflow-wrap: break-word;
        user-select: none;
      }

      h1, h2, h3 {
        text-wrap: balance;
        margin: 0;
      }

      p {
        margin: 0;
      }

      :where(a, code) {
        overflow-wrap: anywhere;
      }

      :where(button, select, textarea, input:not([type="checkbox"], [type="radio"]), label:has(input[type="checkbox"], input[type="radio"])) {
        min-block-size: var(--target-size);
        min-inline-size: var(--target-size);
        font: inherit;
        color: inherit;
      }

      openmat-scorekeeper-app,
      openmat-scoreboard-panel {
        display: block;
      }

      /* Operator Shell */
      .om-operator-shell {
        min-block-size: 100dvh;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      .om-topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: safe center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border-subtle);
      }

      .om-brand-group {
        display: flex;
        flex-wrap: wrap;
        align-items: safe center;
        gap: 8px;
        min-inline-size: 0;
      }

      .om-app-title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--text-gold);
      }

      .om-mode-pill,
      .om-sync-pill {
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
      }

      .om-sync-pill {
        color: #6ee7b7;
      }

      .om-topbar-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: safe center;
        gap: 6px;
      }

      /* Workspace Responsive Split */
      .om-workspace {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 6px 8px;
        align-content: start;
      }

      @media (min-width: 860px) {
        .om-workspace {
          grid-template-columns: minmax(300px, 39%) minmax(0, 1fr);
          align-content: stretch;
          align-items: stretch;
        }
      }

      @media (orientation: landscape) and (max-height: 520px) {
        .om-topbar {
          padding: 3px 8px;
          gap: 5px;
        }
        .om-workspace {
          grid-template-columns: minmax(250px, 38%) minmax(0, 1fr);
          gap: 6px;
          padding: 4px 6px;
          align-content: start;
        }
      }

      @media (max-width: 560px) {
        .om-topbar {
          padding: 4px 8px;
          gap: 5px;
        }
        .om-workspace {
          gap: 4px;
          padding: 4px 6px;
        }
      }

      .om-preview-column {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-inline-size: 0;
      }

      .om-shortcut-strip {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 6px;
        padding: 5px 8px;
        font-size: 12px;
        color: var(--text-secondary);
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
      }

      .om-kbd-hint {
        color: #93c5fd;
      }

      @media (pointer: coarse) {
        .om-kbd-hint {
          display: none;
        }
      }

      .om-controls-column {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-inline-size: 0;
      }

      @media (max-width: 560px) {
        .om-controls-column {
          gap: 4px;
        }
      }

      /* Buttons */
      .om-btn {
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        padding: 7px 11px;
        font-weight: 700;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: var(--bg-elevated);
        color: var(--text-primary);
        transition: filter 0.1s ease, transform 0.08s ease;
      }

      .om-btn:hover:not(:disabled) {
        filter: brightness(1.1);
      }

      .om-btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .om-btn:disabled {
        opacity: 0.36;
        cursor: not-allowed;
      }

      .om-btn-xs {
        padding: 4px 8px;
        font-size: 12px;
      }

      .om-btn-block {
        inline-size: 100%;
      }

      .om-btn-tv {
        background: #d97706;
        color: #080c14;
        border-color: #fbbf24;
      }

      .om-btn-tv-active {
        background: #059669;
        color: #ffffff;
        border-color: #34d399;
      }

      .om-btn-subtle {
        background: #1e2d42;
      }

      .om-btn-clock-start {
        background: var(--emerald-dark);
        border-color: #10b981;
        font-size: 16px;
      }

      .om-btn-clock-stop {
        background: #b91c1c;
        border-color: #f87171;
        font-size: 16px;
      }

      .om-btn-tower {
        background: #26344a;
      }

      .om-btn-medical {
        background: #6e341c;
        border-color: #ea580c;
      }

      .om-btn-danger {
        background: #991b1b;
        border-color: #f87171;
      }

      .om-btn-red-primary {
        background: var(--red-primary);
        border-color: #fb7185;
        font-size: 17px;
      }

      .om-btn-red-secondary {
        background: var(--red-secondary);
        border-color: rgba(251, 113, 133, 0.45);
        font-size: 15px;
      }

      .om-btn-green-primary {
        background: var(--green-primary);
        border-color: #34d399;
        font-size: 17px;
      }

      .om-btn-green-secondary {
        background: var(--green-secondary);
        border-color: rgba(52, 211, 153, 0.45);
        font-size: 15px;
      }

      .om-btn-penalty {
        background: #403420;
        border-color: #a16207;
        font-size: 13px;
      }

      .om-btn-fall {
        background: #a55f12;
        border-color: #f59e0b;
      }

      .om-btn-utility {
        background: #2a3242;
      }

      .om-btn-aux {
        background: #5c2824;
        font-size: 13px;
      }

      .om-btn-undo {
        background: #b97612;
        color: #090d16;
      }

      .om-btn-horn {
        background: #7a4416;
      }

      .om-btn-next-bout {
        background: #185c44;
        border-color: #34d399;
      }

      .om-btn-push {
        background: #3b2d64;
        border-color: #a78bfa;
      }

      /* Clock & Bottom Bars */
      .om-clock-bar {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr 0.9fr;
        gap: 6px;
      }

      @media (max-width: 560px) {
        .om-clock-bar {
          grid-template-columns: 1fr 1fr;
        }
      }

      .om-bottom-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .om-bottom-bar > .om-btn {
        flex: 1 1 82px;
      }

      /* Banners */
      .om-error-banner {
        display: flex;
        align-items: safe center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #4c1118;
        border: 1px solid #f87171;
        color: #fecaca;
        font-weight: 700;
      }

      .om-context-banner {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .om-banner-medical { background: #622a18; }
      .om-banner-techfall { background: #784a0e; }
      .om-banner-expired { background: #483412; }
      .om-banner-toss { background: #293548; }
      .om-banner-red { background: #561624; }
      .om-banner-green { background: #104a32; }
      .om-banner-ended { background: #143d30; }

      .om-banner-title {
        font-weight: 800;
        font-size: 13.5px;
      }

      .om-banner-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .om-banner-actions > .om-btn {
        flex: 1 1 110px;
      }

      /* Dual Red / Green Action Decks */
      .om-swap-bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 6px;
      }

      .om-swap-side {
        font-size: 11.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 4px 10px;
        border-radius: 999px;
      }

      .om-swap-side-red {
        justify-self: start;
        background: rgba(185, 35, 55, 0.25);
        border: 1px solid rgba(251, 113, 133, 0.45);
        color: #fecdd3;
      }

      .om-swap-side-green {
        justify-self: end;
        background: rgba(22, 130, 82, 0.25);
        border: 1px solid rgba(52, 211, 153, 0.45);
        color: #bbf7d0;
      }

      .om-btn-swap {
        background: #233248;
        border-color: #60a5fa;
        padding-inline: 16px;
        font-size: 13.5px;
      }

      .om-btn-swap-active {
        background: #b45309;
        border-color: #fbbf24;
        color: #fffbeb;
      }

      @media (max-width: 520px) {
        .om-swap-bar {
          grid-template-columns: 1fr;
        }
        .om-swap-side {
          display: none;
        }
      }

      .om-corners-grid {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .om-corner-deck {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 7px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        min-inline-size: 0;
      }

      .om-deck-red {
        background: var(--red-deck);
      }

      .om-deck-green {
        background: var(--green-deck);
      }

      .om-deck-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-weight: 800;
        font-size: 12.5px;
        padding-inline: 2px;
      }

      .om-deck-title {
        min-inline-size: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .om-deck-pos,
      .om-deck-pos-btn {
        font-size: 11px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: var(--text-primary);
        min-block-size: var(--target-size);
        flex-shrink: 0;
        cursor: pointer;
        white-space: nowrap;
      }

      .om-deck-pos-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .om-btn-takedown {
        min-block-size: 52px;
      }

      @media (max-width: 560px) {
        .om-corner-deck {
          gap: 4px;
          padding: 5px;
        }
        .om-btn-takedown {
          min-block-size: 46px;
        }
      }

      .om-deck-row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .om-deck-row-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }

      @media (max-width: 440px) {
        .om-deck-row-3 > .om-btn,
        .om-deck-row-2 > .om-btn {
          padding-inline: 5px;
          font-size: 12.5px;
        }
      }

      /* 16:9 Broadcast Scoreboard (Shared by Operator Preview and Chrome Presentation TV) */
      .om-sb-frame {
        inline-size: 100%;
        aspect-ratio: 16 / 9;
        container: scoreboard / size;
        display: flex;
        flex-direction: column;
        background: #080c14;
        border: 1px solid #293a52;
        border-radius: 8px;
        overflow: clip;
        color: #ffffff;
      }

      .om-sb-tv {
        border-radius: 0;
        border-width: 2px;
        border-color: #334155;
      }

      .om-sb-waiting {
        margin: auto;
        font-size: 18px;
        font-weight: 700;
        color: #94a3b8;
      }

      .om-sb-header {
        flex: 0 0 13%;
        display: grid;
        grid-template-columns: 1fr 1.25fr 1fr;
        align-items: center;
        padding-inline: 2.2cqi;
        background: #0e1624;
        font-weight: 800;
      }

      .om-sb-mat {
        font-size: clamp(11px, 7.4cqmin, 56px);
        color: #facc15;
        text-align: start;
      }

      .om-sb-weight {
        font-size: clamp(12px, 8.6cqmin, 66px);
        color: #ffffff;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .om-sb-bout {
        font-size: clamp(11px, 7.4cqmin, 56px);
        color: #facc15;
        text-align: end;
      }

      .om-sb-accent {
        flex: 0 0 0.8%;
        min-block-size: 2px;
        background: #eab308;
      }

      .om-sb-triptych {
        flex: 1 1 69%;
        display: grid;
        grid-template-columns: 1fr 1.08fr 1fr;
        min-block-size: 0;
      }

      .om-sb-corner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 1.4cqmin 1.2cqi;
        min-inline-size: 0;
      }

      .om-sb-red {
        background: #44101c;
      }

      .om-sb-green {
        background: #0a3828;
      }

      .om-sb-name,
      .om-sb-team {
        inline-size: 100%;
        text-align: center;
      }

      .om-sb-name {
        font-weight: 800;
        font-size: clamp(clamp(10px, 3cqmin, 24px), var(--om-fit-font-size, 7.5cqmin), 56px);
      }

      .om-sb-team {
        font-weight: 700;
        font-size: clamp(clamp(8.5px, 2.2cqmin, 18px), var(--om-fit-font-size, 4.9cqmin), 36px);
        color: #e2e8f0;
      }

      .om-sb-label {
        display: inline-block;
        vertical-align: top;
        max-inline-size: 100%;
        text-align: start;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .om-sb-bar {
        inline-size: 100%;
        block-size: max(2px, 1cqmin);
      }

      .om-sb-bar-red { background: #ef4444; }
      .om-sb-bar-green { background: #22c55e; }

      .om-sb-score {
        font-weight: 900;
        line-height: 0.95;
        font-size: clamp(28px, 27cqmin, 210px);
      }

      .om-sb-score-red { color: #ff6e7d; }
      .om-sb-score-green { color: #4ade80; }

      .om-sb-pos {
        font-weight: 800;
        font-size: clamp(9px, 5.2cqmin, 38px);
        color: #f1f5f9;
        white-space: nowrap;
      }

      .om-sb-tower {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2cqmin;
        padding: 1cqmin;
        background: #05080e;
        min-inline-size: 0;
      }

      .om-sb-clock {
        font-weight: 900;
        line-height: 0.96;
        font-size: clamp(26px, 24cqmin, 184px);
        color: #ffffff;
      }

      .om-sb-clock-running {
        color: #4ade80;
      }

      .om-sb-period {
        font-weight: 800;
        font-size: clamp(12px, 8.5cqmin, 64px);
        color: #bad0eb;
      }

      .om-sb-outcome {
        inline-size: 100%;
        text-align: center;
        font-weight: 800;
        font-size: clamp(9px, 5.4cqmin, 40px);
        color: #ffd666;
        min-block-size: 6cqmin;
      }

      .om-sb-queue {
        flex: 0 0 17.2%;
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 1px;
        border-top: 2px solid #304058;
        background: #1c2636;
      }

      .om-sb-qrow {
        display: grid;
        grid-template-columns: 0.62fr 1.04fr 1.17fr 1.17fr;
        gap: 2px;
        background: #080c14;
        align-items: stretch;
      }

      .om-sb-qrow > span {
        align-content: center;
        text-align: center;
        min-inline-size: 0;
        padding-inline: 1cqi;
        font-weight: 800;
      }

      .om-sb-qtag {
        font-size: clamp(8px, 5.2cqmin, 36px);
      }

      .om-sb-qtag-deck {
        background: #eab308;
        color: #0a0e16;
      }

      .om-sb-qtag-hole {
        background: #345a8a;
        color: #ffffff;
      }

      .om-sb-qbout {
        font-size: clamp(8px, 5.6cqmin, 38px);
        background: #121c2c;
        color: #fde047;
      }

      .om-sb-qbout-empty {
        grid-column: 2 / -1;
      }

      .om-sb-qred,
      .om-sb-qgreen {
        font-size: clamp(clamp(8px, 2.6cqmin, 18px), var(--om-fit-font-size, 6cqmin), 42px);
      }

      .om-sb-qred {
        background: #40121c;
        color: #ffd7dc;
      }

      .om-sb-qgreen {
        background: #0c3426;
        color: #d2ffe1;
      }

      /* Chrome Presentation Mode TV Stage */
      .om-receiver-body {
        background: #05080f;
      }

      .om-tv-stage {
        position: relative;
        block-size: 100dvh;
        inline-size: 100%;
        padding: 2vmin;
        display: grid;
        place-items: center;
        background: #05080f;
      }

      .om-tv-stage > openmat-scoreboard-panel {
        inline-size: min(100%, calc((100dvh - 4vmin) * 16 / 9));
      }

      .om-tv-fullscreen-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        opacity: 0.45;
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #475569;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .om-tv-fullscreen-btn:hover {
        opacity: 1;
      }

      /* Native Modal Dialogs */
      dialog {
        background: #122030;
        color: var(--text-primary);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 18px;
        max-inline-size: min(460px, calc(100% - 24px));
        max-block-size: min(92dvh, 760px);
        overflow-y: auto;
        inline-size: 100%;
      }

      .om-dialog-hint {
        font-size: 12.5px;
        color: var(--text-secondary);
      }

      dialog.om-dialog-wide {
        max-inline-size: min(620px, calc(100% - 24px));
      }

      dialog[open] {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      dialog:modal {
        overscroll-behavior: contain;
      }

      dialog::backdrop {
        background: rgba(3, 7, 15, 0.74);
        overflow: hidden;
        overscroll-behavior: contain;
      }

      .om-dialog-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .om-dialog-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }

      .om-tab-bar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .om-setup-pane {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .om-form-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .om-form-grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
      }

      .om-clock-inputs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .om-field {
        display: flex;
